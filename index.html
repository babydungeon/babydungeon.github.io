* { box-sizing: border-box; }

iframe { display: block; margin: 0 auto; background: #fff; }
.btn { display: inline-block; min-height: 44px; padding: 10px 20px; background: var(--gold); color: #1b1b2f; font-family: "Galmuri11 Bold", "Galmuri11", sans-serif; text-decoration: none; border: 3px solid #1b1b2f; }
.btn:hover, .btn:focus-visible { background: #fff; outline: 3px solid var(--gold); }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 32px; }
